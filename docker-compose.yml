services:
  web:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: production
      SECRET_KEY: ${SECRET_KEY}
      API_URL: http://api:2000
    depends_on:
      - api
    networks:
      - my_network

  api:
    image: postgrest/postgrest
    environment:
      PGRST_JWT_SECRET: ${SECRET_KEY}
      PGRST_DB_URI: ${DATABASE_URL}
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: anonymous
      PGRST_SERVER_PORT: 2000
      PGRST_APP_SETTINGS_JWT_SECRET: ${SECRET_KEY}
      PGRST_APP_SETTINGS_JWT_EXPIRE_SECONDS: 3600

    ports:
      - "2000:2000"
    depends_on:
      - db
    networks:
      - my_network

  db:
    image: postgres:latest
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_SUPER_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - my_network

volumes:
  postgres_data:

networks:
  my_network:
    name: my_network
    driver: bridge
